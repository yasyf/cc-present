name: CI (iOS)

on:
  push:
    branches: [main, "owner-apps/**"]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "Package.swift"
      - ".github/workflows/ci-ios.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# One job, not a matrix: everything needs the same macOS runner, and macOS
# minutes bill 10x. xcode-27 is pinned (not macos-latest) because that image
# ships Xcode 27 — the toolchain and iOS SDK this app targets.
jobs:
  test:
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install lint tools missing from the image
        # Guard both against image churn: not every macOS image ships them.
        run: |
          command -v swiftformat >/dev/null || brew install swiftformat
          command -v swiftlint >/dev/null || brew install swiftlint
      # Style is advisory, never a gate (see AGENTS.md): the runner's brew-latest
      # swiftformat/swiftlint enable newer default rules than the pinned toolchain,
      # so a lint deviation surfaces in the log but must not fail the build.
      - name: Format (lint mode)
        working-directory: ios
        continue-on-error: true
        run: swiftformat --lint .
      - name: Lint
        working-directory: ios
        continue-on-error: true
        run: swiftlint --quiet
      - name: Test (CcPresentKit and CcPresentUI packages)
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ runner.temp }}/block-snapshots
        run: >
          mkdir -p "$TEST_RUNNER_SNAPSHOT_DIR" &&
          xcodebuild test
          -scheme cc-present-Package
          -destination 'platform=iOS Simulator,name=iPhone 17'
          CODE_SIGNING_ALLOWED=NO
      - name: Upload block snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: block-snapshots
          path: ${{ runner.temp }}/block-snapshots
          if-no-files-found: warn
      - name: Test (iOS Simulator)
        run: >
          xcodebuild test
          -project ios/CcPresent.xcodeproj
          -scheme CcPresent
          -destination 'platform=iOS Simulator,name=iPhone 17'
          CODE_SIGNING_ALLOWED=NO
