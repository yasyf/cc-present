<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System map board check</title>
    <style>
      body { margin: 0; padding: 24px; background: #f4f3ee; font-family: system-ui, sans-serif; }
      .host { --smap-max-h: min(80vh, 760px); border: 1px solid #dcdad2; border-radius: 10px; margin-bottom: 32px; }
      [data-width="board"] { width: calc(100vw - 48px); }
      [data-width="column"] { width: min(560px, 100%); }
    </style>
  </head>
  <body>
    <script type="module">
      import { mount } from "../src/system-map.js";
      import { mount as mountArch } from "../src/arch-map.js";
      import rough from "../node_modules/roughjs/bundled/rough.esm.js";
      const q = new URLSearchParams(location.search);
      const file = q.get("f");
      const data = await fetch(`../${file}`).then((r) => r.json());
      const host = (id, cls) => {
        const h = document.createElement("div");
        h.className = "host";
        h.id = id;
        if (cls) h.dataset.width = cls;
        document.body.append(h);
        return h;
      };
      const handles = [];
      if (data.arch) {
        const focuses = [null];
        const walk = (list) => list.forEach((n) => { if ((n.nodes || []).length) focuses.push(n.id); walk(n.nodes || []); });
        walk(data.nodes);
        for (const f of focuses) for (const w of ["board", "column"]) handles.push(mountArch(host(`${w}-${f || "top"}`, w), data, { state: f ? { focus: f } : {} }));
      } else {
        const skin = q.get("skin") || "sketch";
        for (const w of ["board", "column"]) handles.push(mount(host(w, w), data, { rough, skin }));
      }
      await Promise.all(handles.map((h) => h.ready));
      window.boardReady = true;
    </script>
  </body>
</html>
